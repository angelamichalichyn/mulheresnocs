<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mulheres no CS — Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#C8506A;--rose-light:#F5E6EA;--rose-dark:#8B2D42;--cream:#FBF7F4;--warm:#F0E8E2;--text:#1C1410;--muted:#7A6860;--hint:#B0A09A;--border:#E2D5CF;--surface:#fff;--green:#1D9E75;--green-light:#E1F5EE;--red:#E24B4A;--red-light:#FCEBEB;--amber:#BA7517;--amber-light:#FAEEDA;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);font-size:14px;min-height:100vh}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1rem}
.login-card{background:var(--surface);border-radius:20px;padding:2.5rem 2rem;width:100%;max-width:380px;box-shadow:0 4px 32px rgba(140,50,60,.08)}
.login-logo{font-family:'Playfair Display',serif;font-size:22px;color:var(--rose-dark);margin-bottom:.25rem}
.login-logo em{font-style:italic;color:var(--rose)}
.login-sub{font-size:13px;color:var(--muted);margin-bottom:1.75rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.field input{width:100%;padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:14px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--cream);color:var(--text)}
.field input:focus{outline:none;border-color:var(--rose)}
.btn{padding:8px 16px;border-radius:8px;border:1.5px solid var(--border);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text);transition:all .15s}
.btn:hover{background:var(--warm)}
.btn.primary{background:var(--rose);color:#fff;border-color:var(--rose);width:100%;padding:11px;font-size:14px}
.btn.primary:hover{background:var(--rose-dark)}
.btn.approve{border-color:var(--green);color:var(--green)}
.btn.approve:hover{background:var(--green-light)}
.btn.reject{border-color:var(--red);color:var(--red)}
.btn.reject:hover{background:var(--red-light)}
.btn.excel{border-color:#1D6F42;color:#1D6F42;display:inline-flex;align-items:center;gap:6px}
.btn.excel:hover{background:#E8F5EE}
.error-msg{background:var(--red-light);color:#A32D2D;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:1rem;display:none}
#app{display:none}
.topbar{background:var(--rose-dark);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between}
.topbar-logo{font-family:'Playfair Display',serif;font-size:18px;color:#fff}
.topbar-logo em{font-style:italic;color:#F7C5CF}
.topbar-admin{font-size:13px;color:#F0D8DC;display:flex;align-items:center;gap:10px}
.topbar-admin button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px}
.main{max-width:1000px;margin:0 auto;padding:1.5rem 1rem 3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem}
.stat{background:var(--surface);border-radius:var(--radius);padding:.9rem 1.1rem;border:1px solid var(--border)}
.stat .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.stat .num{font-size:26px;font-weight:500}
.stat.p .num{color:var(--amber)}.stat.a .num{color:var(--green)}.stat.r .num{color:var(--red)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.tabs{display:flex;gap:6px}
.tab{padding:7px 18px;border-radius:20px;border:1.5px solid var(--border);background:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted);font-weight:500}
.tab.active{background:var(--rose);color:#fff;border-color:var(--rose)}
.cnt{display:inline-block;background:rgba(255,255,255,.25);border-radius:10px;font-size:11px;padding:1px 7px;margin-left:5px}
.tab:not(.active) .cnt{background:var(--warm);color:var(--muted)}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--border);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 14px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--border);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--cream)}
.name-cell strong{display:block;font-weight:500}
.name-cell span{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.badge.pendente{background:var(--amber-light);color:var(--amber)}
.badge.aprovado{background:var(--green-light);color:var(--green)}
.badge.rejeitado{background:var(--red-light);color:var(--red)}
.badge.cpf-ok{background:var(--green-light);color:var(--green)}
.badge.cpf-check{background:var(--warm);color:var(--muted)}
.badge.doc-ext{background:#EEF2FF;color:#4338CA}
.empty{text-align:center;padding:3rem;color:var(--hint);font-size:13px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center;padding:1rem}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:20px;padding:1.75rem;width:100%;max-width:540px;max-height:90vh;overflow-y:auto}
.modal h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--rose-dark);margin-bottom:1.25rem}
.foto-box{background:var(--cream);border-radius:var(--radius);min-height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:.75rem;overflow:hidden;border:1px solid var(--border)}
.foto-box img{max-width:100%;max-height:280px;display:block;object-fit:cover}
.foto-box .hint{color:var(--hint);font-size:13px}
.video-box{background:#000;border-radius:var(--radius);margin-bottom:.75rem;overflow:hidden;display:none}
.video-box video{width:100%;max-height:240px;display:block}
.lgpd-note{font-size:11px;color:var(--hint);text-align:center;margin-bottom:1.25rem}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem}
.info-item .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.info-item .val{font-size:13px;font-weight:500}
.nick-edit-box{grid-column:1/-1;background:var(--cream);border-radius:8px;padding:10px 12px}
.nick-edit-box .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.nick-edit-row{display:flex;gap:8px}
.nick-edit-row input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;background:#fff}
.nick-edit-row input:focus{outline:none;border-color:var(--rose)}
.motivo-field{margin-bottom:1rem;display:none}
.motivo-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.motivo-field textarea{width:100%;padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:13px;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);color:var(--text);resize:vertical}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border);padding-top:1rem;margin-top:1rem}
@media(max-width:600px){th:nth-child(4),td:nth-child(4){display:none}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Mulheres no <em>CS</em></div>
    <div class="login-sub">Painel administrativo — acesso restrito</div>
    <div class="error-msg" id="login-error"></div>
    <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="admin@email.com"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')fazerLogin()"></div>
    <button class="btn primary" onclick="fazerLogin()">Entrar</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-logo">Mulheres no <em>CS</em></div>
    <div class="topbar-admin"><span id="admin-nome"></span><button onclick="logout()">Sair</button></div>
  </div>
  <div class="main">
    <div class="stats">
      <div class="stat p"><div class="lbl">Pendentes</div><div class="num" id="stat-p">—</div></div>
      <div class="stat a"><div class="lbl">Aprovadas</div><div class="num" id="stat-a">—</div></div>
      <div class="stat r"><div class="lbl">Rejeitadas</div><div class="num" id="stat-r">—</div></div>
    </div>
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" onclick="mudarAba('pendente',this)">Pendentes <span class="cnt" id="cnt-p">0</span></button>
        <button class="tab" onclick="mudarAba('aprovado',this)">Aprovadas <span class="cnt" id="cnt-a">0</span></button>
        <button class="tab" onclick="mudarAba('rejeitado',this)">Rejeitadas <span class="cnt" id="cnt-r">0</span></button>
      </div>
      <button class="btn excel" onclick="exportarExcel()">📊 Exportar Excel</button>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Nome / Nick</th>
            <th>Nasc.</th>
            <th>Cidade</th>
            <th>Telefone</th>
            <th>Documento</th>
            <th>Recebido</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h3>Revisar cadastro</h3>
    <div class="foto-box" id="foto-box"><span class="hint">Carregando...</span></div>
    <div class="video-box" id="video-box"><video id="modal-video" controls></video></div>
    <div class="lgpd-note">A foto/vídeo será deletada permanentemente após sua decisão.</div>
    <div class="info-grid" id="modal-info"></div>
    <div class="motivo-field" id="motivo-field">
      <label>Motivo da rejeição (opcional)</label>
      <textarea id="motivo-txt" rows="2" placeholder="Ex: documento ilegível..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="fecharModal()">Cancelar</button>
      <button class="btn reject" onclick="decidir('rejeitar')">✗ Rejeitar</button>
      <button class="btn approve" onclick="decidir('aprovar')">✓ Aprovar</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('admin_token');
let abaAtual = 'pendente';
let cadastroAtivoId = null;
let cache = [];

if (token) iniciarApp();

async function fazerLogin() {
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  if (!email || !senha) { err.textContent = 'Preencha e-mail e senha.'; err.style.display = 'block'; return; }
  try {
    const res = await fetch(`${API}/admin/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, senha })
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.erro || 'Credenciais inválidas.'; err.style.display = 'block'; return; }
    token = data.token;
    localStorage.setItem('admin_token', token);
    iniciarApp(data.nome);
  } catch { err.textContent = 'Erro de conexão.'; err.style.display = 'block'; }
}

function iniciarApp(nome) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  if (nome) document.getElementById('admin-nome').textContent = nome;
  carregarStats();
  carregarCadastros();
}

async function carregarStats() {
  const data = await req('GET', '/admin/cadastros?stats=1');
  if (!data) return;
  document.getElementById('stat-p').textContent = data.pendente;
  document.getElementById('stat-a').textContent = data.aprovado;
  document.getElementById('stat-r').textContent = data.rejeitado;
  document.getElementById('cnt-p').textContent = data.pendente;
  document.getElementById('cnt-a').textContent = data.aprovado;
  document.getElementById('cnt-r').textContent = data.rejeitado;
}

async function carregarCadastros() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '<tr><td colspan="7" class="empty">Carregando...</td></tr>';
  const data = await req('GET', `/admin/cadastros?status=${abaAtual}`);
  if (!data || !data.cadastros.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">Nenhum cadastro aqui.</td></tr>';
    cache = []; return;
  }
  cache = data.cadastros;
  tbody.innerHTML = cache.map(c => {
    const docBadge = c.doc_tipo === 'CPF'
      ? `<span class="badge ${c.cpf_situacao === 'REGULAR' ? 'cpf-ok' : 'cpf-check'}">CPF ${c.cpf_situacao === 'REGULAR' ? '✓' : '?'}</span>`
      : `<span class="badge doc-ext">${esc(c.doc_tipo || 'Doc. ext.')}</span>`;
    const temVideo = c.tem_video ? ' 🎬' : '';
    return `<tr>
      <td class="name-cell"><strong>${esc(c.nome_completo)}</strong><span>@${esc(c.nick)}${temVideo}</span></td>
      <td>${fmtData(c.data_nascimento)}</td>
      <td>${esc(c.cidade || '—')}</td>
      <td>${esc(c.telefone || '—')}</td>
      <td>${docBadge}</td>
      <td style="color:var(--muted)">${fmtDataHora(c.criado_em)}</td>
      <td><button class="btn" onclick="abrirModal('${c.id}')">Ver</button></td>
    </tr>`;
  }).join('');
}

function mudarAba(aba, btn) {
  abaAtual = aba;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  carregarCadastros();
}

async function abrirModal(id) {
  cadastroAtivoId = id;
  document.getElementById('modal-bg').classList.add('open');
  document.getElementById('motivo-field').style.display = 'none';
  document.getElementById('motivo-txt').value = '';
  document.getElementById('video-box').style.display = 'none';

  const fotoBox = document.getElementById('foto-box');
  fotoBox.innerHTML = '<span class="hint">Carregando...</span>';

  const mediaData = await req('GET', `/admin/cadastros?id=${id}`);
  if (mediaData?.url) {
    fotoBox.innerHTML = `<img src="${mediaData.url}" alt="Selfie com documento">`;
  } else {
    fotoBox.innerHTML = '<span class="hint">Sem foto</span>';
  }
  if (mediaData?.video_url) {
    document.getElementById('modal-video').src = mediaData.video_url;
    document.getElementById('video-box').style.display = 'block';
  }

  const c = cache.find(x => x.id === id);
  if (!c) return;

  const docInfo = c.doc_tipo === 'CPF'
    ? `CPF — ${c.cpf_situacao === 'REGULAR' ? '✓ Regular' : '⚠ Verificar doc.'}`
    : `${c.doc_tipo || 'Documento estrangeiro'}`;

  document.getElementById('modal-info').innerHTML = `
    <div class="info-item"><div class="lbl">Nome completo</div><div class="val">${esc(c.nome_completo)}</div></div>
    <div class="info-item"><div class="lbl">Nick atual</div><div class="val">@${esc(c.nick)}</div></div>
    <div class="info-item"><div class="lbl">Nascimento</div><div class="val">${fmtData(c.data_nascimento)}</div></div>
    <div class="info-item"><div class="lbl">Telefone</div><div class="val">${esc(c.telefone || '—')}</div></div>
    <div class="info-item"><div class="lbl">Cidade</div><div class="val">${esc(c.cidade || '—')}</div></div>
    <div class="info-item"><div class="lbl">Endereço</div><div class="val">${esc(c.endereco || '—')}</div></div>
    <div class="info-item"><div class="lbl">Documento</div><div class="val">${esc(docInfo)}</div></div>
    <div class="info-item"><div class="lbl">Status</div><div class="val"><span class="badge ${c.status}">${c.status}</span></div></div>
    ${c.motivo_rejeicao ? `<div class="info-item" style="grid-column:1/-1"><div class="lbl">Motivo da rejeição</div><div class="val" style="color:var(--red);background:var(--red-light);padding:8px 10px;border-radius:8px;font-weight:400">${esc(c.motivo_rejeicao)}</div></div>` : ''}
    <div class="nick-edit-box">
      <div class="lbl">Alterar nick</div>
      <div class="nick-edit-row">
        <input type="text" id="nick-edit" value="${esc(c.nick)}" placeholder="Novo nick">
        <button class="btn approve" onclick="alterarNick('${c.id}')">Salvar</button>
      </div>
    </div>
  `;
}

async function alterarNick(id) {
  const novoNick = document.getElementById('nick-edit').value.trim();
  if (novoNick.length < 3) { alert('Nick precisa ter pelo menos 3 caracteres.'); return; }
  const res = await req('PATCH', '/admin/cadastros?action=nick', { id, nick: novoNick });
  if (res) { alert('Nick atualizado!'); fecharModal(); carregarCadastros(); }
}

function fecharModal() {
  document.getElementById('modal-bg').classList.remove('open');
  const v = document.getElementById('modal-video');
  v.pause(); v.src = '';
  cadastroAtivoId = null;
}

async function decidir(acao) {
  if (!cadastroAtivoId) return;
  if (acao === 'rejeitar') {
    const mf = document.getElementById('motivo-field');
    if (mf.style.display === 'none') { mf.style.display = 'block'; return; }
  }
  const motivo = document.getElementById('motivo-txt').value;
  const res = await req('PATCH', '/admin/cadastros', { id: cadastroAtivoId, acao, motivo });
  if (res) { fecharModal(); carregarStats(); carregarCadastros(); }
}

async function exportarExcel() {
  const data = await req('GET', `/admin/cadastros?status=${abaAtual}&limit=9999`);
  if (!data || !data.cadastros.length) { alert('Nenhum cadastro para exportar.'); return; }
  const linhas = [['Nome Completo','Nick','Nascimento','Telefone','Cidade','Endereço','Tipo Documento','Doc. Situação','Status','Recebido em']];
  data.cadastros.forEach(c => {
    linhas.push([
      c.nome_completo||'', c.nick||'',
      c.data_nascimento ? new Date(c.data_nascimento).toLocaleDateString('pt-BR') : '',
      c.telefone||'', c.cidade||'', c.endereco||'',
      c.doc_tipo||'CPF', c.cpf_situacao||'',
      c.status||'',
      c.criado_em ? new Date(c.criado_em).toLocaleString('pt-BR') : ''
    ]);
  });
  const csv = linhas.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mulheresnocs_${abaAtual}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

async function req(method, path, body) {
  try {
    const res = await fetch(`${API}${path}`, {
      method, headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: body ? JSON.stringify(body) : undefined
    });
    if (res.status === 401) { logout(); return null; }
    return await res.json();
  } catch { return null; }
}

function logout() { localStorage.removeItem('admin_token'); location.reload(); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtData(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : '—'; }
function fmtDataHora(d) { return d ? new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—'; }
</script>
</body>
</html>
